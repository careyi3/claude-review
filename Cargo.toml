[package]
name = "claude-review-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Local diff review tool: review Claude's changes in a browser, leave line comments, hand them back as a structured blob."
readme = "README.md"
license = "MIT"
repository = "https://github.com/careyi3/claude-review"
homepage = "https://github.com/careyi3/claude-review"
keywords = ["claude", "code-review", "diff", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]

# web/dist is gitignored; listing it here ships the prebuilt UI, so installing
# from crates.io needs no Node. Build it with `yarn --cwd web build` first.
include = [
    "/build.rs",
    "/src/**",
    "/commands/**",
    "/web/dist/**",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "claude_review"
path = "src/lib.rs"

[[bin]]
name = "claude-review"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.5.61", features = ["derive"] }
dirs = "7.0.0"
futures = "0.3.34"
hex = "0.4.3"
notify = "8.2.0"
percent-encoding = "2.3.2"
rand = "0.9.5"
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.7"
similar = "2.7.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-stream = "0.1.19"
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
dirs = "7.0.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream"] }
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
