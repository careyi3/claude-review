[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "careyi3/homebrew-tap"
# Formula name, so brew users get `claude-review` rather than the crate name
formula = "claude-review"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# release.yml is hand-edited (the tap commit author), so dist must not
# regenerate it or fail CI over the difference
allow-dirty = ["ci"]
# Releases are created on GitHub, which pushes the tag that starts the
# workflow; upload to that release rather than creating one
create-release = false
# Steps to run before each build: installs the UI's dependencies for build.rs
github-build-setup = "../build-setup.yml"
